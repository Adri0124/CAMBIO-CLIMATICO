<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Simulador HLM Agronómico - UNJu</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .dashboard { background: #2d2d2d; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 90%; max-width: 900px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .panel-controles { background: #3d3d3d; padding: 20px; border-radius: 10px; }
        .panel-graficos { background: #ffffff10; padding: 20px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; }
        h2 { color: #4db6ac; margin-top: 0; grid-column: span 2; text-align: center; }
        label { display: block; font-size: 0.85em; margin-top: 10px; color: #b0bec5; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #4db6ac; }
        .stat-card { text-align: center; margin-top: 15px; width: 100%; }
        #gauge-container { width: 200px; height: 100px; position: relative; }
        .alerta { grid-column: span 2; padding: 10px; border-radius: 5px; text-align: center; font-weight: bold; min-height: 20px; }
    </style>
</head>
<body>

    <div class="dashboard">
        <h2>Dashboard HLM: Resiliencia del Agroecosistema (IPCC/FAO)</h2>

        <div class="panel-controles">
            <label>🌡️ Temperatura Global (+°C): <b id="vT">0</b></label>
            <input type="range" id="T" min="0" max="5" step="0.5" value="0" oninput="run()">

            <label>⛈️ Intensidad de Lluvia (Dore 2005): <b id="vI">Baja</b></label>
            <input type="range" id="I" min="10" max="120" value="20" oninput="run()">

            <label>🪱 Materia Orgánica (%) : <b id="vMO">2</b></label>
            <input type="range" id="MO" min="0.5" max="6" step="0.5" value="2" oninput="run()">

            <label>🌳 Biodiversidad (Ficha A vs B): <b id="vB">0.5</b></label>
            <input type="range" id="B" min="0.1" max="1" step="0.1" value="0.5" oninput="run()">
            
            <hr style="border: 0.5px solid #555; margin: 20px 0;">
            <label>💧 Riego Suplementario (FAO):</label>
            <select id="riego" onchange="run()" style="width:100%; padding:8px; background:#444; color:white; border:none; border-radius:5px;">
                <option value="0">Sin Riego (Secano)</option>
                <option value="20">Riego por Goteo (Eficiente)</option>
                <option value="40">Manejo Intensivo</option>
            </select>
        </div>

        <div class="panel-graficos">
            <canvas id="chartRendimiento" width="200" height="200"></canvas>
            <div class="stat-card">
                <div style="font-size: 0.9em; color: #aaa;">Huella de Carbono (Subsidios)</div>
                <div id="costoEnergia" style="font-size: 1.5em; color: #ff5252;">0%</div>
            </div>
        </div>

        <div id="msgAlerta" class="alerta">Cargando sistema...</div>
    </div>

    <script>
        let chart;
        
        function initChart() {
            const ctx = document.getElementById('chartRendimiento').getContext('2d');
            chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Rendimiento', 'Pérdida'],
                    datasets: [{
                        data: [100, 0],
                        backgroundColor: ['#4db6ac', '#333'],
                        borderWidth: 0
                    }]
                },
                options: { cutout: '80%', plugins: { legend: { display: false } } }
            });
        }

        function run() {
            // Captura de variables
            let t = parseFloat(document.getElementById('T').value);
            let i = parseFloat(document.getElementById('I').value);
            let mo = parseFloat(document.getElementById('MO').value);
            let b = parseFloat(document.getElementById('B').value);
            let riego = parseFloat(document.getElementById('riego').value);

            // Update Labels
            document.getElementById('vT').innerText = "+" + t;
            document.getElementById('vMO').innerText = mo + "%";
            document.getElementById('vB').innerText = b;
            document.getElementById('vI').innerText = i > 70 ? "EXTREMA" : (i > 40 ? "ALTA" : "NORMAL");

            // --- Lógica del Modelo HLM ---
            let rendimiento = 100;
            let subsidios = 0;
            let alerta = document.getElementById('msgAlerta');
            
            // 1. Efecto IPCC: Temperatura -> Estrés y Demanda
            rendimiento -= (t * 10); // Pérdida directa por calor
            subsidios += (t * 5);    // Costo de enfriamiento/riego extra

            // 2. Efecto Dore: Intensidad -> Infiltración
            let infiltracionEfectiva = 100 - (i * 0.5); 
            if (i > 80 && mo < 3) {
                rendimiento -= 30; // Sellado de suelo
                alerta.innerText = "🚨 COLAPSO: SUELO SELLADO POR INTENSIDAD";
                alerta.style.background = "#d32f2f";
            } else {
                alerta.innerText = "✅ SISTEMA OPERATIVO";
                alerta.style.background = "#388e3c";
            }

            // 3. Efecto Fichas: Biodiversidad -> Control de Plagas
            if (b < 0.3) {
                subsidios += 40; // Necesitas más agroquímicos
                rendimiento -= 20;
                if (b < 0.2) alerta.innerText = "🐛 PLAGA DESCONTROLADA (Baja Biodiversidad)";
            }

            // 4. Mitigación por MO y Riego
            rendimiento += (mo * 5); // La MO amortigua
            if (riego > 0) subsidios += (riego * 0.5);

            // Limitar valores
            rendimiento = Math.max(0, Math.min(100, rendimiento));
            subsidios = Math.max(0, subsidios);

            // Actualizar Gráfica
            chart.data.datasets[0].data = [rendimiento, 100 - rendimiento];
            chart.update();
            
            document.getElementById('costoEnergia').innerText = Math.round(subsidios) + " units";
        }

        window.onload = () => { initChart(); run(); };
    </script>
</body>
</html>
