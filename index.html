<div style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #2c3e50; color: white; padding: 25px; border-radius: 20px; max-width: 650px; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
    <h2 style="color: #4db6ac; text-align: center; margin-top: 0;">Simulador HLM Pro: Estados del Agroecosistema</h2>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div>
            <label style="font-size: 0.8em;">🌡️ Temp. Extrema (°C): <span id="vT">30</span></label>
            <input type="range" id="T" min="20" max="50" value="30" style="width:100%" oninput="update()">
            
            <label style="font-size: 0.8em;">⛈️ Intensidad Lluvia (mm/h): <span id="vI">20</span></label>
            <input type="range" id="I" min="0" max="120" value="20" style="width:100%" oninput="update()">

            <label style="font-size: 0.8em;">🌿 Biodiversidad (Índice): <span id="vB">1.0</span></label>
            <input type="range" id="B" min="0" max="1" step="0.1" value="1" style="width:100%" oninput="update()">
        </div>

        <div style="background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px;">
            <div id="statusSuelo" style="margin-bottom: 8px;">🧪 Suelo: <span style="color:#81c784">Sano</span></div>
            <div id="statusPlanta" style="margin-bottom: 8px;">🌽 Cultivo: <span style="color:#81c784">Productivo</span></div>
            <div id="statusPlaga" style="margin-bottom: 8px;">🐜 Plagas: <span style="color:#81c784">Controladas</span></div>
        </div>
    </div>

    <div style="margin-top: 20px; background: #ecf0f1; color: #2c3e50; padding: 20px; border-radius: 10px; text-align: center;">
        <div style="font-size: 1.2em;">Resiliencia del Sistema: <b id="resiliencia">100%</b></div>
        <div style="font-size: 2em; margin: 10px 0;" id="rendimiento">Rendimiento: 100%</div>
        <p id="msg" style="font-style: italic; font-size: 0.9em; color: #7f8c8d;"></p>
    </div>
</div>

<script>
function update() {
    let t = document.getElementById('T').value;
    let i = document.getElementById('I').value;
    let b = document.getElementById('B').value;
    
    document.getElementById('vT').innerText = t;
    document.getElementById('vI').innerText = i;
    document.getElementById('vB').innerText = b;

    let rend = 100;
    let res = 100;
    let msg = "El sistema mantiene su equilibrio dinámico.";

    // Lógica de Cambios de Estado (Non-linear transitions)
    
    // 1. Punto de quiebre térmico (Fisiología)
    if (t > 42) {
        rend -= 60;
        document.getElementById('statusPlanta').innerHTML = "🌽 Cultivo: <span style='color:#e57373'>ABORTO FLORAL</span>";
        msg = "Colapso fisiológico por golpe de calor (IPCC).";
    } else {
        document.getElementById('statusPlanta').innerHTML = "🌽 Cultivo: <span style='color:#81c784'>Productivo</span>";
    }

    // 2. Cambio de estado del suelo (Física de suelos)
    if (i > 70) {
        res -= 40;
        document.getElementById('statusSuelo').innerHTML = "🧪 Suelo: <span style='color:#ffb74d'>DEGRADADO (Sello)</span>";
        msg = "Intensidad extrema de Dore (2005) causó encostramiento.";
    } else {
        document.getElementById('statusSuelo').innerHTML = "🧪 Suelo: <span style='color:#81c784'>Sano</span>";
    }

    // 3. Quiebre de Biodiversidad (Ecología - Ficha B)
    if (b < 0.4) {
        rend -= 30;
        document.getElementById('statusPlaga').innerHTML = "🐜 Plagas: <span style='color:#e57373'>OUTBREAK (Plaga)</span>";
        msg = "Baja biodiversidad eliminó controladores biológicos.";
    } else {
        document.getElementById('statusPlaga').innerHTML = "🐜 Plagas: <span style='color:#81c784'>Controladas</span>";
    }

    // Cálculo final
    res = res * b; // La biodiversidad multiplica la resiliencia
    if(rend < 0) rend = 0;

    document.getElementById('resiliencia').innerText = Math.round(res) + "%";
    document.getElementById('rendimiento').innerText = "Rendimiento: " + Math.round(rend) + "%";
    document.getElementById('msg').innerText = msg;
}
update();
</script>
